apiVersion: v1
kind: Namespace
metadata:
  name: mazlusek-web-preview
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: mazlusek-web-preview
data:
  default.conf: |
    server {
      listen 80;
      root /usr/share/nginx/html;
      index index.html;
      absolute_redirect off;
      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header Cache-Control "no-cache" always;
      error_page 404 /404.html;
      location / {
        try_files $uri $uri/ =404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-preview
  namespace: mazlusek-web-preview
spec:
  replicas: 1
  selector:
    matchLabels: { app: web-preview }
  template:
    metadata:
      labels: { app: web-preview }
    spec:
      initContainers:
        - name: assemble
          image: nginx:alpine
          command: ["sh", "-c"]
          args:
            - |
              cp /src/root/* /site/ &&
              mkdir -p /site/en/privacy /site/privacy &&
              cp /src/en/* /site/en/ &&
              cp /src/privacy/* /site/privacy/ &&
              cp /src/en-privacy/* /site/en/privacy/
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: site, mountPath: /site }
            - { name: src-root, mountPath: /src/root }
            - { name: src-en, mountPath: /src/en }
            - { name: src-privacy, mountPath: /src/privacy }
            - { name: src-en-privacy, mountPath: /src/en-privacy }
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: site, mountPath: /usr/share/nginx/html, readOnly: true }
            - { name: conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - { name: site, emptyDir: {} }
        - { name: conf, configMap: { name: nginx-conf } }
        - { name: src-root, configMap: { name: site-root } }
        - { name: src-en, configMap: { name: site-en } }
        - { name: src-privacy, configMap: { name: site-privacy } }
        - { name: src-en-privacy, configMap: { name: site-en-privacy } }
---
apiVersion: v1
kind: Service
metadata:
  name: web-preview
  namespace: mazlusek-web-preview
spec:
  selector: { app: web-preview }
  ports:
    - { port: 80, targetPort: 80 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-preview
  namespace: mazlusek-web-preview
spec:
  ingressClassName: nginx
  rules:
    - host: mazlusek-preview.lan.mazlusek.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-preview
                port: { number: 80 }
